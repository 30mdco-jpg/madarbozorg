name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform files
        run: |
          flutter create --platforms=android --org app.madarbozorg --project-name madarbozorg_family .
          rm -f test/widget_test.dart

      - name: Configure Android app (id, name, notifications, desugaring)
        run: |
          python3 scripts/patch_android.py android
          grep -n -E "applicationId|esugar" android/app/build.gradle* || true
          grep -n -E "uses-permission|android:label|Scheduled" android/app/src/main/AndroidManifest.xml

      - name: Download Vazirmatn font (optional)
        run: |
          mkdir -p assets/fonts
          BASE=https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/ttf
          curl -fsSL "$BASE/Vazirmatn-Regular.ttf" -o assets/fonts/Vazirmatn-Regular.ttf || true
          curl -fsSL "$BASE/Vazirmatn-Bold.ttf" -o assets/fonts/Vazirmatn-Bold.ttf || true
          python3 scripts/enable_font.py

      - name: Install packages
        run: flutter pub get

      - name: Generate App Icon
        run: dart run flutter_launcher_icons

      - name: Analyze (only errors fail the build)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: madarbozorg-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
