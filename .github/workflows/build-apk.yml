name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform files
        run: |
          flutter create --platforms=android --org app.madarbozorg --project-name madarbozorg_family .

      - name: Configure Android app (id, name, internet permission)
        run: |
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i -E 's/applicationId[[:space:]]*=?[[:space:]]*"[^"]+"/applicationId = "app.madarbozorg.family"/' "$f"
            fi
          done
          M=android/app/src/main/AndroidManifest.xml
          sed -i -E 's/android:label="[^"]*"/android:label="دورهمی مادربزرگ"/' "$M"
          if ! grep -q 'android.permission.INTERNET' "$M"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$M"
          fi
          grep -n "applicationId" android/app/build.gradle* || true
          grep -n -E "INTERNET|android:label" "$M"

      - name: Download Vazirmatn font (optional)
        run: |
          mkdir -p assets/fonts
          BASE=https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/ttf
          curl -fsSL "$BASE/Vazirmatn-Regular.ttf" -o assets/fonts/Vazirmatn-Regular.ttf || true
          curl -fsSL "$BASE/Vazirmatn-Bold.ttf" -o assets/fonts/Vazirmatn-Bold.ttf || true
          if [ -f scripts/enable_font.py ]; then
            python3 scripts/enable_font.py
          else
            echo "Font configuration script not found; skipping."
          fi

      - name: Install packages
        run: flutter pub get

      - name: Analyze (only errors fail the build)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: madarbozorg-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
