name: madarbozorg\_family
description: اپلیکیشن نوبت‌بندی خانوادگی «نوبت بی بی»
publish\_to: 'none'
version: 0.3.0+3

environment:
  sdk: '&gt;=3.5.0 &lt;4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter\_localizations:
    sdk: flutter
  supabase\_flutter: ^2.10.0
  flutter\_local\_notifications: ^19.5.0
  timezone: ^0.10.0
  workmanager: ^0.10.10
  shared\_preferences: ^2.3.0

dev\_dependencies:
  flutter\_test:
    sdk: flutter
  flutter\_lints: ^4.0.0
  flutter\_launcher\_icons: ^0.14.4

flutter:
  uses-material-design: true

# FONTS\_PLACEHOLDER

flutter\_launcher\_icons:
  android: true
  ios: false
  image\_path: "assets/app\_icon.png"
  remove\_alpha: true